name: Benchmark

# Full benchmark sweep. Run on demand and weekly, not on every push.
#
# A caveat worth stating plainly: GitHub-hosted runners are shared, virtualised,
# and noisy. Numbers produced here are useful for spotting a large regression
# over time; they are NOT the numbers published in the README. Those come from
# a recorded run on known hardware, with the machine, CPU, and library versions
# captured in benches/results/results.json.
on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Row counts to benchmark (space-separated)"
        required: false
        default: "100000 500000"
      repetitions:
        description: "Timed repetitions per cell"
        required: false
        default: "7"
  schedule:
    # Weekly, at an off-peak minute to avoid the top-of-hour scheduling crowd.
    - cron: "37 4 * * 1"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Full benchmark sweep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pinned comparison libraries
        run: |
          python -m pip install -U pip
          python -m pip install -r benches/requirements.txt

      - name: Build native extension
        run: maturin develop --release

      - name: Run benchmark sweep
        run: |
          python -m benches.bench \
            --rows ${{ github.event.inputs.rows || '100000 500000' }} \
            --repetitions ${{ github.event.inputs.repetitions || '7' }} \
            --strict \
            --out ci-results.json

      # Rendered against the CI results so the run is readable at a glance,
      # without touching the committed README.
      - name: Summarise
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          from benches.render import render_summary, render_environment
          path = pathlib.Path("ci-results.json")
          if not path.exists():
              print("Benchmark run produced no results.")
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print("## Benchmark results (CI runner — noisy, not for publication)\n")
          print("\n".join(render_summary(report)))
          print()
          print("\n".join(render_environment(report)))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ci-results.json
          retention-days: 90
